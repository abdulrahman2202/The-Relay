[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-relay-rag"
version = "0.1.0"
description = "Local ingestion and retrieval for The Relay's three research papers"
requires-python = ">=3.12"
dependencies = [
    "pymupdf==2.1",
    "sentence-transformers==6.2.0",
    "chromadb==1.5.9",
    "numpy==2.5.4",
    "torch==2.15.0",
    "transformers==5.22.2",
    "tokenizers==0.23.3",
    "huggingface-hub==2.4.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.14.14"]

[project.scripts]
relay-rag = "retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["retrieval*"]

[tool.pytest.ini_options]
testpaths = ["tests/rag"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: uses the pinned, locally cached SentenceTransformer model"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
